name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, "1.88.0"]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: cargo test --workspace --no-default-features --locked
      - name: Documentation without evaluation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-default-features --no-deps --locked

  evaluation:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      NIX_VERSION: 2.34.8
      CARGO_TERM_COLOR: never
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils build-essential python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Provide pinned Nix binaries
        # Copy the binary distribution without invoking its installer or Nix.
        # Every evaluation command then goes through Rusix's disposable stores.
        run: |
          curl -fsSL "https://releases.nixos.org/nix/nix-$NIX_VERSION/nix-$NIX_VERSION-x86_64-linux.tar.xz" -o "$RUNNER_TEMP/nix.tar.xz"
          echo "2c2e146b80834fe0ca201b51deeb939405b4f18e8d2071bf80b10f8123c50464  $RUNNER_TEMP/nix.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/nix.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p /nix/store
          cp -a "$RUNNER_TEMP/nix-$NIX_VERSION-x86_64-linux/store/." /nix/store/
          for directory in /nix/store/*-nix-$NIX_VERSION; do
            echo "$directory/bin" >> "$GITHUB_PATH"
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p rusix-derive --features dev-tools --bin check-rust-spacing
      - run: cargo test --workspace --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Verify release archives and consumers
        run: python3 scripts/check-release.py
