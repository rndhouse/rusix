[workspace]
members = ["crates/rusnix-ir", "crates/rusnix-nix", "crates/rusnix-cli", "crates/rusnix-derive"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
rusnix-ir = { path = "crates/rusnix-ir" }
rusnix-nix = { path = "crates/rusnix-nix" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
