[workspace]
members = ["crates/rusix-ir", "crates/rusix-nix", "crates/rusix-cli", "crates/rusix-derive"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
rusix-ir = { path = "crates/rusix-ir" }
rusix-nix = { path = "crates/rusix-nix" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
